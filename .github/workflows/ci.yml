name: CI — RiftShield

on:
  push:
    branches: ["main", "RS-TESTS", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Backend — lint + unit/integration tests
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python 3.13 · pytest)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/riftshield_test
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-minimum-32-chars
      FRONTEND_URL: http://localhost:1999
      PORT: 3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov ruff

      - name: Lint backend (ruff)
        working-directory: backend
        run: ruff check src/

      - name: Run pytest
        working-directory: backend
        env:
          PYTHONPATH: src
        run: python -m pytest src/ -v -p no:flask --tb=short --junitxml=pytest-results.xml --cov=src --cov-report=term-missing --cov-fail-under=50

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: backend/pytest-results.xml

  # ─────────────────────────────────────────────────────────────
  # Job 2: Frontend — lint + Vitest unit tests
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20 · Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Security audit (npm)
        working-directory: frontend
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Run Vitest
        working-directory: frontend
        run: npm run test -- --run --reporter=verbose

  # ─────────────────────────────────────────────────────────────
  # Job 3: E2E — Cypress (runs only when frontend + backend pass)
  # ─────────────────────────────────────────────────────────────
  e2e-real:
    name: E2E (Cypress · Real Environment)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

    env:
      # Backend Env
      DATABASE_URL: mongodb://127.0.0.1:27017/riftshield_test
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-minimum-32-chars
      FRONTEND_URL: http://127.0.0.1:1999
      PORT: 3000
      NODE_ENV: test
      # Cypress Env
      CYPRESS_BASE_URL: http://127.0.0.1:1999
      CYPRESS_API_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      # ─── Setup Backend ──────────────────────────────────────
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Seed the database for E2E tests
        working-directory: backend
        env:
          PYTHONPATH: src
        run: python scripts/seed.py

      - name: Run backend server in background
        working-directory: backend
        env:
          PYTHONPATH: src
        run: |
          uvicorn main:app --host 0.0.0.0 --port 3000 &
          # Give lifespan (DB init) a moment before wait-on
          sleep 3

      # ─── Setup Frontend ─────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Patch Cypress spawn to add --disable-gpu for CI Electron
        working-directory: frontend
        run: |
          python3 <<'PYEOF'
          import sys
          f = 'node_modules/cypress/lib/exec/spawn.js'
          s = open(f, encoding='utf-8').read()
          PAT = "electronArgs.push('--no-sandbox');"
          REP = "electronArgs.push('--no-sandbox'); electronArgs.push('--disable-gpu'); electronArgs.push('--disable-dev-shm-usage');"
          print(f'File length: {len(s)} chars')
          print(f'PAT found: {PAT in s}')
          print(f'Already has dev-shm: {"--disable-dev-shm-usage" in s}')
          if '--disable-dev-shm-usage' in s:
              print('already patched'); sys.exit(0)
          if PAT not in s:
              idx = s.find('electronArgs')
              print('PATTERN NOT FOUND. Sample:', repr(s[max(0,idx-10):idx+150]) if idx>=0 else 'electronArgs not found!')
              sys.exit(1)
          s = s.replace(PAT, REP, 1)
          open(f, 'w', encoding='utf-8').write(s)
          # verify
          s2 = open(f, encoding='utf-8').read()
          ok = '--disable-dev-shm-usage' in s2
          print('Patch verified OK:', ok)
          if not ok:
              sys.exit(1)
          PYEOF

      - name: Run frontend server in background
        working-directory: frontend
        run: npm run dev -- --port 1999 &

      # ─── Wait & Run Tests ───────────────────────────────────
      - name: Install Cypress Linux dependencies
        run: |
          sudo apt-get update -qq
          # Required packages (stable across ubuntu-latest images)
          sudo apt-get install -y -qq \
            libgtk-3-0 \
            libnss3 \
            libxss1 \
            libgbm1 \
            libxtst6 \
            libnotify4 \
            xauth
          # Optional/variant packages (best-effort to avoid hard fail on apt naming differences)
          sudo apt-get install -y -qq libatk-bridge2.0-0 libdrm2 libxkbcommon0 || true
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2 || true

      - name: Wait for services to be ready
        run: npx wait-on http-get://127.0.0.1:3000/api/health http-get://127.0.0.1:1999 --timeout 90000

      - name: Smoke test — seeded admin login
        run: |
          code=$(curl -s -o /tmp/login.json -w "%{http_code}" \
            -X POST http://127.0.0.1:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"test@riftshield.com","password":"test123"}')
          echo "Direct login HTTP status: $code"
          cat /tmp/login.json
          test "$code" = "200"
          python -c "import json; d=json.load(open('/tmp/login.json')); assert d['user']['email']=='test@riftshield.com'; assert 'accessToken' in d, d"

      - name: Smoke test — Vite proxy login
        run: |
          code=$(curl -s -o /tmp/proxy-login.json -w "%{http_code}" \
            -X POST http://127.0.0.1:1999/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"test@riftshield.com","password":"test123"}')
          echo "Proxy login HTTP status: $code"
          cat /tmp/proxy-login.json
          test "$code" = "200"
          python -c "import json; d=json.load(open('/tmp/proxy-login.json')); assert 'accessToken' in d, d"

      - name: Run Cypress E2E (Electron with Chrome fallback)
        working-directory: frontend
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "softpipe"
          # Pass extra flags directly to the Cypress Electron binary
          ELECTRON_EXTRA_LAUNCH_ARGS: "--disable-gpu --disable-dev-shm-usage"
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 +extension GLX +extension RENDER" \
            npx cypress run --browser electron --reporter spec 2>&1 | tee /tmp/cypress-out.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 27 ]; then
            echo "::warning title=cypress-fallback::Electron exited with code 27, retrying on Chrome"
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 +extension GLX +extension RENDER" \
              npx cypress run --browser chrome --headless --reporter spec 2>&1 | tee -a /tmp/cypress-out.txt
            status=${PIPESTATUS[0]}
          fi
          exit "$status"

      - name: Annotate with Cypress output (first 200 lines)
        if: always()
        run: |
          head -200 /tmp/cypress-out.txt 2>/dev/null | while IFS= read -r line; do
            echo "::notice title=cypress-log::$line"
          done || echo "::notice title=cypress-log::(no output)"

      - name: Publish Cypress summary
        if: always()
        run: |
          {
            echo "## Cypress output (tail)"
            echo ""
            echo '```'
            tail -n 120 /tmp/cypress-out.txt 2>/dev/null || echo "(no cypress output)"
            echo '```'
            echo ""
            echo "## Screenshots"
            echo '```'
            find frontend/cypress/screenshots -type f 2>/dev/null | sort || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Cypress console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-console-log
          path: /tmp/cypress-out.txt
          if-no-files-found: ignore

      - name: List failed Cypress screenshots
        if: failure()
        run: find frontend/cypress/screenshots -type f 2>/dev/null | sort || true

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          if-no-files-found: ignore
