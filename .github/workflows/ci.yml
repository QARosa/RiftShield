name: CI — RiftShield

on:
  push:
    branches: ["main", "RS-TESTS", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Backend — lint + unit/integration tests
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python 3.13 · pytest)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/riftshield_test
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-minimum-32-chars
      FRONTEND_URL: http://localhost:1999
      PORT: 3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run pytest
        working-directory: backend
        run: python -m pytest src/ -v --tb=short --junitxml=pytest-results.xml

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: backend/pytest-results.xml

  # ─────────────────────────────────────────────────────────────
  # Job 2: Frontend — lint + Vitest unit tests
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20 · Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest
        working-directory: frontend
        run: npm run test -- --run --reporter=verbose

  # ─────────────────────────────────────────────────────────────
  # Job 3: E2E — Cypress (runs only when frontend + backend pass)
  # ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Cypress · intercept mode)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Serve frontend (preview)
        working-directory: frontend
        run: npm run preview -- --port 1999 &
        # Wait for server to be ready
      - name: Wait for frontend
        run: npx wait-on http://localhost:1999 --timeout 30000

      - name: Run Cypress E2E
        working-directory: frontend
        run: npx cypress run --browser chrome --headless
        env:
          CYPRESS_BASE_URL: http://localhost:1999

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          if-no-files-found: ignore
