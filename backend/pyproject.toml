[project]
name = "riftshield-backend"
version = "0.1.0"
description = "RiftShield Backend - Auth Module"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "beanie>=1.28.0",
    "motor>=3.6.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E722", "E701", "E741", "F811", "E501"]

[tool.ruff.lint.per-file-ignores]
"src/modules/inference/ml-workflow/**" = ["F821", "F841"]
