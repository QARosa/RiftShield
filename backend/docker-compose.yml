services:
  mongo:
    image: mongo:7
    container_name: riftshield-mongo
    restart: unless-stopped
    ports:
      - "27020:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: riftshield
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riftshield-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://mongo:27017/riftshield
    command: ["uvicorn", "main:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "3000", "--reload"]
    volumes:
      - ./src:/usr/src/app/src

volumes:
  mongo-data:
